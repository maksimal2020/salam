name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  server:
    name: Сервер (тесты API)
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U app" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_ADMIN_URL: postgres://app:app@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test -w server

  flutter:
    name: Приложение (analyze, test, APK)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      # Android lint из актуального AGP вызывает List.removeLast() — это Java 21; на
      # Java 17 по умолчанию release-сборка падает в :lintVitalAnalyzeRelease.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter --version
      # Шрифты Inter урезаны (tool/subset_fonts.py): все знаки из i18n, content и lib должны в них быть.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install fonttools && python3 tool/subset_fonts.py check
      # Папки android/ и ios/ в репозитории нет: их создаёт flutter create, не трогая lib/, test/ и pubspec.yaml.
      - run: flutter create --platforms=android,ios --org ru.example --project-name migrant_guide .
      # flutter create кладёт шаблонный test/widget_test.dart (ссылается на MyApp) — он нашему приложению не нужен.
      - run: rm -f test/widget_test.dart
      - run: python3 tool/configure_platforms.py
      - run: flutter pub get
      - run: dart run flutter_launcher_icons
      # Информационные замечания печатаем, но не считаем ошибкой: нужны ошибки и предупреждения.
      - run: flutter analyze --no-fatal-infos
      - run: flutter test
        timeout-minutes: 15
      - run: flutter build apk --debug --dart-define=API_BASE_URL=http://10.0.2.2:3000
      - uses: actions/upload-artifact@v4
        with:
          name: salam-debug-apk
          path: mobile/build/app/outputs/flutter-apk/app-debug.apk
      # Сборка для установки на телефон, смотрит на боевой сервер. Отдельный APK на каждый тип
      # процессора (arm64 — почти все телефоны, armeabi-v7a — старые и бюджетные), без x86_64
      # (только эмуляторы). Символы Dart вынесены из APK (--split-debug-info) — они нужны лишь
      # для расшифровки стеков сбоев, хранятся отдельным артефактом.
      # Подписана отладочным ключом из шаблона Flutter: для ручной установки этого
      # достаточно, для RuStore/Google Play понадобится собственный ключ подписи.
      - run: >-
          flutter build apk --release --split-per-abi --target-platform android-arm,android-arm64
          --obfuscate --split-debug-info=build/symbols
          --dart-define=API_BASE_URL=https://app.salam-app.ru
      - run: ls -la build/app/outputs/flutter-apk/
      - uses: actions/upload-artifact@v4
        with:
          name: salam-release-apk
          path: |
            mobile/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            mobile/build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
      - uses: actions/upload-artifact@v4
        with:
          name: salam-release-symbols
          path: mobile/build/symbols/

  flutter-ios:
    name: Приложение (iOS, сборка без подписи)
    runs-on: macos-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter --version
      # Папки android/ и ios/ в репозитории нет: их создаёт flutter create, не трогая lib/, test/ и pubspec.yaml.
      - run: flutter create --platforms=android,ios --org ru.example --project-name migrant_guide .
      # flutter create кладёт шаблонный test/widget_test.dart (ссылается на MyApp) — он нашему приложению не нужен.
      - run: rm -f test/widget_test.dart
      - run: python3 tool/configure_platforms.py
      - run: flutter pub get
      - run: dart run flutter_launcher_icons
      - run: flutter analyze --no-fatal-infos
      - run: flutter test
        timeout-minutes: 15
      # Без подписи (--no-codesign) — проверяем только то, что приложение компилируется.
      # Для сборки .ipa под TestFlight/App Store понадобятся сертификат, provisioning
      # profile или ключ App Store Connect API (Apple Developer Program) — этого шага
      # здесь нет.
      - run: flutter build ios --release --no-codesign --dart-define=API_BASE_URL=https://example.invalid
