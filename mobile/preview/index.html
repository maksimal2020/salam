<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=390">
<title>Salam! — документы для мигрантов</title>
<style>
/* ===== Токены. Во Flutter: ThemeExtension с этими слотами (светлая + тёмная ColorScheme вручную) ===== */
:root{
 --bg:#F3F6F8;--surface:#FFFFFF;--line:#D3DCE2;--line2:#7F8E9A;
 --ink:#0E1D27;--ink2:#41505B;--ink3:#566673;
 --accent:#0A5873;--accent-d:#06415A;--accent-soft:#E3EFF3;--on-accent:#FFFFFF;
 --ok:#12643D;--ok-soft:#E3F3EA;
 --warn:#7A4200;--warn-soft:#FFF3DC;--warn-line:#B96A00;--hatch:#E3A23C;
 --bad:#A5261F;--bad-soft:#FBE9E7;--scrim:#0E1D2788;--frame:#DDE3E8}
:root.dark{
 --bg:#0D1418;--surface:#151F26;--line:#2A3944;--line2:#7E919E;
 --ink:#E8EEF1;--ink2:#B4C2CB;--ink3:#9DAEB9;
 --accent:#7CCBE6;--accent-d:#A9DDF0;--accent-soft:#16303B;--on-accent:#06212C;
 --ok:#6FD6A1;--ok-soft:#14301F;
 --warn:#F5BE6E;--warn-soft:#33250E;--warn-line:#D18B2A;--hatch:#8A5A12;
 --bad:#FF9A92;--bad-soft:#3A1916;--scrim:#000A;--frame:#05080A}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--frame);font-family:Inter,"Noto Sans","DejaVu Sans",Arial,sans-serif;color:var(--ink);display:flex;justify-content:center;padding:24px;font-size:16px;line-height:1.5}
.phone{width:390px;height:844px;background:var(--bg);border-radius:36px;border:10px solid #111;position:relative;overflow:hidden;display:flex;flex-direction:column}
.status{height:28px;display:flex;justify-content:space-between;align-items:center;padding:0 22px;font-size:12px;font-weight:600;flex:none}
.status i{font-style:normal;letter-spacing:2px}
.ic{display:inline-flex;width:24px;height:24px;flex:none}.ic svg{width:100%;height:100%}
.ic.s{width:20px;height:20px}.ic.xs{width:18px;height:18px}
/* ----- верхняя панель ----- */
.top{background:var(--surface);border-bottom:1px solid var(--line);flex:none}
.top .row{min-height:56px;display:flex;align-items:center;padding:0 8px 0 20px;gap:4px}
.top .row.sub{padding:0 20px 12px;min-height:0}
.top .back{width:48px;height:48px;margin-left:-12px;display:flex;align-items:center;justify-content:center;color:var(--ink);flex:none}
.top h1{font-size:20px;font-weight:600;line-height:26px;flex:1;padding:8px 0}
.brand{display:flex;align-items:center;gap:10px;flex:1;font-size:20px;font-weight:700;letter-spacing:-.01em}
.logo{width:32px;height:32px;border-radius:9px;background:var(--accent);color:var(--on-accent);display:flex;align-items:center;justify-content:center}
.logo .ic{width:22px;height:22px}
.ib{min-width:44px;height:44px;display:flex;align-items:center;justify-content:center;gap:4px;font-size:14px;font-weight:600;color:var(--ink)}
.cityb{display:flex;align-items:center;gap:10px;min-height:44px;padding:8px 14px;border:1.5px solid var(--line2);border-radius:12px;font-size:16px;font-weight:500;line-height:22px;color:var(--ink);background:var(--surface);max-width:100%}
.cityb .ic:first-child{color:var(--accent)}.cityb .ic:last-child{margin-left:auto;color:var(--ink2)}
.cityb span.t{flex:1}
.offline{background:var(--ink);color:var(--surface);padding:10px 20px;font-size:14px;line-height:20px;display:flex;gap:10px;align-items:center}
/* ----- тело ----- */
.body{flex:1;overflow:hidden;position:relative}
.scroll{padding:20px 20px 24px;height:100%;overflow-y:auto;scrollbar-width:none}.scroll::-webkit-scrollbar{display:none}
h2.hs{font-size:28px;line-height:34px;font-weight:700;letter-spacing:-.015em;margin-bottom:14px}
h2.hs.sm{font-size:24px;line-height:30px}
.lead{font-size:17px;line-height:26px;color:var(--ink)}
.p{font-size:16px;line-height:24px;color:var(--ink)}
.small{font-size:14px;line-height:20px;color:var(--ink2)}
/* ----- навигация ----- */
.nav{height:72px;background:var(--surface);border-top:1px solid var(--line);display:flex;flex:none}
.nav div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:3px;font-size:12.5px;font-weight:500;text-align:center;line-height:15px;padding:9px 3px 0;color:var(--ink2);position:relative}
.nav .sel{color:var(--accent);font-weight:700}
.nav .sel:before{content:"";position:absolute;top:-1px;left:22%;right:22%;height:4px;border-radius:0 0 4px 4px;background:var(--accent)}
.nav .ic{width:26px;height:26px}
/* ----- кнопки ----- */
.btn{display:flex;align-items:center;gap:12px;min-height:56px;border-radius:14px;font-size:17px;font-weight:600;line-height:22px;width:100%;margin-bottom:12px;padding:10px 12px 10px 18px;text-align:left}
.btn .lbl{flex:1}
.btn .go{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex:none}
.btn.f{background:var(--accent);color:var(--on-accent)}.btn.f .go{background:#ffffff2e}
.btn.o{border:1.5px solid var(--accent);color:var(--accent);background:var(--surface)}.btn.o .go{background:var(--accent-soft)}
.btn.t{color:var(--accent);padding-left:6px}
.btn.s{min-height:44px;width:auto;display:inline-flex;font-size:16px;padding:8px 16px;margin-bottom:0;border-radius:12px}
.btn.s .go{display:none}
.btn.c{justify-content:center}
.btn .ic{flex:none}
/* ----- поля ----- */
.fl{display:block;font-size:14px;line-height:20px;font-weight:600;color:var(--ink2);margin:14px 0 6px}
.field{border:1.5px solid var(--line2);border-radius:12px;min-height:56px;padding:12px 16px;display:flex;align-items:center;gap:12px;font-size:17px;background:var(--surface)}
.field .v{flex:1}.field.ph{color:var(--ink3)}.field .ic{color:var(--ink2)}
.field.area{min-height:104px;align-items:flex-start}
.fgroup{margin-bottom:2px}
/* ----- фишки / теги ----- */
.chipscroll{position:relative;margin:0 -20px}
.chipscroll:after{content:"";position:absolute;right:0;top:0;bottom:0;width:36px;background:linear-gradient(90deg,#f3f6f800,var(--bg))}
.chips{display:flex;gap:8px;padding:0 20px;overflow:hidden}
.chip{display:inline-flex;flex:none;align-items:center;gap:6px;min-height:44px;padding:0 16px;border:1.5px solid var(--line2);border-radius:12px;font-size:16px;font-weight:500;background:var(--surface);color:var(--ink);white-space:nowrap}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:600}
.tag{display:inline-flex;align-items:center;gap:6px;min-height:28px;padding:2px 10px;border-radius:8px;font-size:13px;line-height:18px;font-weight:500;border:1px solid var(--line2);color:var(--ink2);background:transparent}
.tag .ic{width:16px;height:16px}
.nec{display:inline-flex;align-items:center;gap:5px;min-height:30px;padding:3px 9px 3px 7px;border-radius:8px;font-size:14px;line-height:20px;font-weight:600;border:1.5px solid var(--line2);color:var(--ink2)}
.nec .ic{width:17px;height:17px}
.nec.mandatory{color:var(--bad);border-color:var(--bad);background:var(--bad-soft)}
.badges{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0}
/* ----- ПЕЧАТИ: проверено = сплошной щит; демо = пунктир + предупреждающий треугольник ----- */
.stamp{display:inline-flex;align-items:center;gap:5px;min-height:30px;padding:3px 9px 3px 7px;border-radius:8px;font-size:14px;line-height:20px;font-weight:700}
.stamp .ic{width:17px;height:17px}
.stamp.v{background:var(--ok);color:#fff}
:root.dark .stamp.v{color:#06210F}
.stamp.d{background:var(--warn-soft);color:var(--warn);border:2px dashed var(--warn-line);padding:1px 7px 1px 5px}
/* ----- карточки: три «грамматики» происхождения ----- */
.c{margin-bottom:14px;position:relative;overflow:hidden}
.c .pad{padding:16px}
.c h3{font-size:19px;line-height:25px;font-weight:600;letter-spacing:-.005em}
.c p{font-size:16px;line-height:24px;color:var(--ink2)}
/* официальная: белый «бланк», строгие углы, полоса статуса сверху */
.c.off{background:var(--surface);border:1px solid var(--line);border-radius:12px}
.band{height:8px}.band.v{background:var(--ok)}.band.d{background:repeating-linear-gradient(135deg,var(--hatch) 0 6px,var(--warn-soft) 6px 12px)}
.c.off.done{border-color:var(--accent);border-width:1.5px}.c.off.done h3,.c.off.done p{color:var(--ink2)}
/* редакция: мягкая заливка без границы, большие скругления */
.c.edt{background:var(--accent-soft);border-radius:22px}
/* пользователь: пунктирный контур на фоне страницы */
.c.usr{background:var(--surface);border:2px dashed var(--line2);border-radius:12px}
.src{display:flex;align-items:center;gap:10px;font-size:14px;line-height:18px;font-weight:600;color:var(--ink2);margin-bottom:10px}
.src .arrowc{margin-left:auto;width:36px;height:36px;border-radius:50%;background:var(--accent);color:var(--on-accent);display:flex;align-items:center;justify-content:center;flex:none;margin-top:-3px;margin-bottom:-3px}
.src .tile{width:30px;height:30px;display:flex;align-items:center;justify-content:center;flex:none}
.src .tile .ic{width:20px;height:20px}
.src.official .tile{background:var(--accent);color:var(--on-accent);border-radius:6px}
.src.official{color:var(--accent)}
.src.editorial .tile{background:var(--surface);color:var(--accent);border-radius:50%}
.src.editorial{color:var(--accent-d)}
.src.user .tile{background:var(--bg);color:var(--ink2);border-radius:50%;border:1.5px dashed var(--line2)}
.tr{display:flex;gap:12px;align-items:flex-start}.tr h3{flex:1;padding-top:2px}
.goc{width:44px;height:44px;border-radius:50%;background:var(--accent);color:var(--on-accent);display:flex;align-items:center;justify-content:center;flex:none;margin:-4px -4px 0 0}
.c.off .badges{margin:12px 0 10px}
.price{font-size:18px;line-height:24px;font-weight:700;margin-top:8px;color:var(--ink)}
.meta{display:flex;gap:8px;align-items:flex-start;font-size:15px;line-height:22px;font-weight:500;margin:4px 0 12px;color:var(--ink2)}.meta .ic{margin-top:1px}
.meta .ic{color:var(--ink2)}
.dates{display:flex;flex-wrap:wrap;column-gap:16px;row-gap:2px;margin-top:12px;font-size:13px;line-height:18px;color:var(--ink2)}
.c.edt .foot{margin-top:12px;padding-top:12px;border-top:1px solid #0A587340;font-size:14px;line-height:20px;color:var(--ink2)}
/* ----- уведомления ----- */
.notice{display:flex;gap:12px;background:var(--accent-soft);border-radius:12px;padding:12px 14px;margin:10px 0;font-size:16px;line-height:23px;position:relative;overflow:hidden}
.notice .ic{color:var(--accent);margin-top:0}
.notice .nb{flex:1}
.notice.demo{background:var(--warn-soft);border:2px dashed var(--warn-line);padding-left:28px}
.notice.demo:before{content:"";position:absolute;left:0;top:0;bottom:0;width:10px;background:repeating-linear-gradient(135deg,var(--hatch) 0 5px,var(--warn-soft) 5px 10px)}
.notice.demo .ic{color:var(--warn)}
.notice.demo.dd{display:block;padding:14px 16px 14px 28px;font-size:16px;line-height:24px}
.notice.ok{background:var(--ok-soft)}.notice.ok .ic{color:var(--ok)}
.err{display:flex;gap:12px;background:var(--bad-soft);color:var(--bad);border:1.5px solid var(--bad);border-radius:12px;padding:12px 16px;margin:14px 0;font-size:16px;line-height:24px;font-weight:500}
/* ----- детали документа ----- */
.sec{margin-top:26px}
.info .ib2{padding:14px 16px}.info .ib2+.ib2{border-top:1px solid var(--line)}.info .k{font-size:14px;line-height:20px;font-weight:700;color:var(--accent);margin-bottom:2px}
.sec h4{font-size:20px;line-height:26px;font-weight:700;letter-spacing:-.01em;margin-bottom:10px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px}
.prep .it{display:flex;gap:12px;padding:12px 16px;font-size:16px;line-height:24px;align-items:flex-start}
.prep .it+.it{border-top:1px solid var(--line)}
.prep .sq{width:22px;height:22px;border:2px solid var(--accent);border-radius:6px;flex:none;margin-top:1px}
.steps{position:relative}
.step{display:flex;gap:14px;position:relative;padding-bottom:16px}
.step:last-child{padding-bottom:0}
.step:not(:last-child):before{content:"";position:absolute;left:15px;top:34px;bottom:2px;width:2px;background:var(--line2)}
.step .n{width:32px;height:32px;border-radius:50%;background:var(--accent);color:var(--on-accent);font-weight:700;font-size:16px;display:flex;align-items:center;justify-content:center;flex:none}
.step .tx{font-size:16px;line-height:24px;padding-top:3px}
.kv{display:flex;gap:14px;padding:14px 16px;align-items:flex-start}
.kv+.kv{border-top:1px solid var(--line)}
.kv .ic{color:var(--accent);margin-top:1px}
.kv .k{font-size:14px;line-height:20px;font-weight:600;color:var(--ink2)}
.kv .v{font-size:16px;line-height:24px}
.kv .v i{font-style:normal;color:var(--warn);font-weight:600}
.kv .v a{color:var(--accent);font-weight:600;text-decoration:underline;text-underline-offset:3px}
.sticky{padding:12px 20px 16px;flex:none;background:var(--surface);border-top:1px solid var(--line)}
.sticky .btn{margin:0}
/* ----- учреждение ----- */
.inst .hd{display:flex;gap:12px;align-items:flex-start}
.inst .hd .tile{width:40px;height:40px;border-radius:8px;background:var(--accent);color:var(--on-accent);display:flex;align-items:center;justify-content:center;flex:none}
.inst .hd h3{flex:1}
.fact{display:flex;gap:12px;padding:9px 0;align-items:flex-start}
.fact+.fact,.facts2+.fact,.fact+.facts2{border-top:1px solid var(--line)}
.fact .ic{color:var(--accent);margin-top:1px}
.fact .k{font-size:13px;line-height:18px;font-weight:600;color:var(--ink2)}
.fact .v{font-size:16px;line-height:22px}
.fact .v a,a.l{color:var(--accent);font-weight:600;text-decoration:underline;text-underline-offset:3px}
.facts2{display:flex;gap:16px;border-top:1px solid var(--line)}
.facts2 .fact{flex:1;border:0}
.facts2 .fact+.fact{border:0}
.srcblk{margin:12px -16px -16px;padding:14px 16px;background:var(--accent-soft);border-top:1px solid var(--line)}
.srcblk .k{display:flex;gap:6px;align-items:center;font-size:13px;line-height:18px;font-weight:600;color:var(--ink2)}
.srcblk a{display:block;font-size:15px;line-height:22px;font-weight:600;color:var(--accent);text-decoration:underline;text-underline-offset:3px;padding:11px 0 8px}
.chk{display:flex;align-items:center;gap:8px;margin-top:6px;font-size:15px;line-height:22px;font-weight:700}
.chk.v{color:var(--ok)}.chk.n{color:var(--warn)}
.wh{display:flex;flex-direction:column;min-height:100%}.wh .empty{margin:auto 0}
.docref{display:flex;gap:10px;align-items:flex-start;margin:12px 0 14px;font-size:15px;line-height:22px;font-weight:500;color:var(--ink2)}
.docref .ic{color:var(--accent);width:22px;height:22px}
.empty{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:32px 20px 20px;text-align:center;margin:8px 0 14px}
.enote{display:flex;gap:10px;text-align:left;font-size:15px;line-height:22px;color:var(--ink2);border-top:1px solid var(--line);margin:0 -20px;padding:16px 20px 0}.enote .ic{color:var(--accent);margin-top:1px}
.empty .big{width:72px;height:72px;border-radius:20px;background:var(--accent-soft);color:var(--accent);display:flex;align-items:center;justify-content:center;margin:0 auto 16px}
.empty .big .ic{width:36px;height:36px}
.empty p{font-size:19px;line-height:27px;font-weight:600;margin-bottom:22px;color:var(--ink)}
.empty .btn{margin-bottom:0}
/* ----- списки/чекбоксы ----- */
.li{padding:6px 0;font-size:17px;display:flex;align-items:center;gap:14px;min-height:44px}
.check{flex:none;width:28px;height:28px;border:2px solid var(--line2);border-radius:8px;display:inline-flex;align-items:center;justify-content:center;color:transparent;background:var(--surface)}
.check .ic{width:20px;height:20px}
.check.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.radio{display:inline-block;flex:none;width:26px;height:26px;border:2px solid var(--line2);border-radius:50%;position:relative;background:var(--surface)}
.radio.on{border-color:var(--accent)}.radio.on:after{content:"";position:absolute;inset:4px;border-radius:50%;background:var(--accent)}
.switch{width:52px;height:32px;border-radius:16px;border:2px solid var(--line2);background:var(--surface);position:relative;flex:none;display:inline-block}
.switch:after{content:"";position:absolute;left:4px;top:4px;width:20px;height:20px;border-radius:50%;background:var(--line2)}
.switch.on{background:var(--accent);border-color:var(--accent)}.switch.on:after{left:24px;background:#fff}
.trow{display:flex;align-items:center;gap:14px;min-height:48px;margin:6px 0 14px;font-size:16px;font-weight:500}
.trow .lb{flex:1}
.ttl{font-size:14px;line-height:20px;font-weight:700;color:var(--ink2);margin:22px 0 6px}
/* ----- прогресс ----- */
.seg{display:flex;gap:4px;margin:8px 0 18px}.seg i{flex:1;height:10px;border-radius:3px;background:#fff;border:1.5px solid var(--line2)}.seg i.on{background:var(--accent);border-color:var(--accent)}
.prog{display:flex;align-items:center;gap:8px;font-size:17px;font-weight:700}
.prog .ic{color:var(--accent)}
.acts{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px}.acts .btn.s{font-size:15px;padding:8px 14px;gap:8px}.acts .btn.t{padding:8px 8px}
.itrow{display:flex;gap:6px}
.cbw{width:44px;height:44px;margin:-8px 0 0 -8px;display:flex;align-items:center;justify-content:center;flex:none}
.lnk{display:flex;align-items:center;gap:10px;min-height:48px;margin:12px -16px -16px;padding:0 16px;border-top:1px solid var(--line);color:var(--accent);font-size:16px;font-weight:600}
.lnk .lb{flex:1}

/* ----- мой список (вход) ----- */
.mylist{display:flex;align-items:center;gap:12px;background:var(--accent);color:var(--on-accent);border-radius:14px;padding:14px 12px 14px 16px;margin-bottom:14px}
.mylist .tile{width:40px;height:40px;border-radius:10px;background:#ffffff26;display:flex;align-items:center;justify-content:center;flex:none}
.mylist .tx{flex:1}
.mylist b{display:block;font-size:19px;line-height:24px;font-weight:700}
.mylist span.sb{display:block;font-size:14px;line-height:19px;color:#E3F1F6;margin-top:2px}
.mylist .go{width:40px;height:40px;border-radius:50%;background:#fff;color:var(--accent);display:flex;align-items:center;justify-content:center;flex:none}
:root.dark .mylist .go{background:var(--on-accent);color:var(--accent)}
:root.dark .mylist span.sb{color:#0B3A4C}
:root.dark .mylist .tile{background:#06212C33}
.search{min-height:52px;border-radius:12px;background:var(--surface);border:1.5px solid var(--line2);display:flex;align-items:center;padding:0 16px;gap:12px;color:var(--ink3);font-size:16px;line-height:22px;margin-bottom:12px;padding-top:8px;padding-bottom:8px}
.search .ic{color:var(--ink2)}
/* ----- язык / город ----- */
.lang{display:flex;align-items:center;gap:16px;min-height:64px;border-radius:14px;background:var(--surface);border:1.5px solid var(--line2);padding:8px 14px 8px 10px;margin-bottom:12px;font-size:20px;font-weight:600}
.lang .code{width:44px;height:44px;border-radius:10px;background:var(--accent-soft);color:var(--accent);font-size:15px;font-weight:700;display:flex;align-items:center;justify-content:center;flex:none;letter-spacing:.02em}
.lang .nm{flex:1}.lang .ic{color:var(--accent)}
.hero{width:72px;height:72px;border-radius:20px;background:var(--accent);color:var(--on-accent);display:flex;align-items:center;justify-content:center;margin-bottom:20px}
.hero .ic{width:40px;height:40px}
.found{display:flex;gap:14px;align-items:flex-start;background:var(--surface);border:1.5px solid var(--accent);border-radius:14px;padding:16px;margin:4px 0 20px;font-size:19px;line-height:27px;font-weight:600}
.found .tile{width:40px;height:40px;border-radius:10px;background:var(--accent-soft);color:var(--accent);display:flex;align-items:center;justify-content:center;flex:none}

window.show=async(name,o={})=>{
 if(o.lang&&o.lang!==S.lang){S.lang=o.lang}

 if('city' in o)S.city=o.city;if('district' in o)S.district=o.district;if(o.profile)S.profile=o.profile;if(o.marks)S.marks=o.marks;if('offline' in o)S.offline=o.offline;
